name: Production Tests

on:
    workflow_call:
        inputs:
            PHP_VERSION:
                description: PHP version used for the production installation test
                type: string
                required: true

jobs:
    production-installation:
        name: Production installation (PostgreSQL)
        runs-on: ubuntu-latest
        env:
            APP_ENV: prod
            APP_DEBUG: '0'
            CI_USER_PASSWORD: 'Yap-CI-Only-Password-123!'

        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_DB: app
                    POSTGRES_USER: app
                    POSTGRES_PASSWORD: postgres
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U app -d app"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5


        steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Setup PHP
          uses: shivammathur/setup-php@v2
          with:
              php-version: ${{ inputs.PHP_VERSION }}
              extensions: pdo_pgsql
              coverage: none

        - name: Install production dependencies
          run: composer install --no-interaction --prefer-dist --no-progress --no-dev --optimize-autoloader

        - name: Configure application
          run: |
              printf '%s\n' \
                'postgresql' \
                '127.0.0.1' \
                '5432' \
                'app' \
                'app' \
                'postgres' \
                | script -q -e -c 'php bin/console yap:setup' /dev/null

        - name: Create database and run migrations
          run: |
              php bin/console doctrine:database:create --if-not-exists
              php bin/console doctrine:schema:create
              php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
              php bin/console doctrine:migrations:migrate --configuration=migrations-data.config.yaml --no-interaction --allow-no-migration

        - name: Generate JWT key pair
          run: php bin/console lexik:jwt:generate-keypair --skip-if-exists

        - name: Create first user
          run: |
              printf '%s\n' \
                'ci-admin' \
                'ci-admin@example.test' \
                'CI' \
                'Administrator' \
                '' \
                "$CI_USER_PASSWORD" \
                "$CI_USER_PASSWORD" \
                | script -q -e -c 'php bin/console yap:user:create' /dev/null

        - name: Dump production environment
          run: composer dump-env prod

        - name: Verify dumped production environment
          run: |
              grep -q "'APP_ENV' => 'prod'" .env.local.php
              grep -Eq "'APP_SECRET' => '[^']+'" .env.local.php
              grep -Eq "'DATABASE_URL' => '[^']+'" .env.local.php
              grep -Eq "'JWT_PASSPHRASE' => '[^']+'" .env.local.php

        - name: Clear production cache
          run: php bin/console cache:clear

        - name: Compile production assets
          run: php bin/console asset-map:compile

        - name: Verify compiled assets
          run: |
              test -f public/assets/admin-FrQOkI9.js
              test -f public/assets/styles/admin-10pdgPX.css

              find public/assets -type f | head -30

        - name: Install Symfony CLI
          run: |
              curl -sS https://get.symfony.com/cli/installer | bash
              echo "$HOME/.symfony5/bin" >> "$GITHUB_PATH"

        - name: Start production web server
          run: |
              symfony server:start \
                --no-tls \
                --port=8000 \
                --listen-ip=127.0.0.1 \
                --daemon

              symfony server:status

        - name: Create API user
          run: |
            printf '%s\n' \
              'ci-api-user' \
              'ci-api@example.test' \
              'CI' \
              'API User' \
              'ROLE_API_USER' \
              "$CI_USER_PASSWORD" \
              "$CI_USER_PASSWORD" \
              | script -q -e -c 'php bin/console yap:user:create' /dev/null

        - name: Test API authentication
          run: |
              RESPONSE=$(curl --fail --silent --show-error \
                -X POST http://127.0.0.1:8000/api/auth \
                -H 'Content-Type: application/json' \
                -d "{\"username\":\"ci-api-user\",\"password\":\"$CI_USER_PASSWORD\"}")

              TOKEN=$(echo "$RESPONSE" | jq -er '.token')

              test -n "$TOKEN"
              echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"
              echo "API authentication successful. JWT received."

        - name: Test API locales
          run: |
              EXPECTED_LOCALES='[
                "ar", "bg_BG", "ca_AD", "cs_CZ", "da_DK", "de_DE",
                "el_GR", "en_GB", "es_ES", "eu_ES", "fa_IR", "fi_FI",
                "fr_FR", "gl_ES", "he_IL", "hr_HR", "hu_HU", "hy_AM",
                "id_ID", "it_IT", "lb_LU", "lt_LT", "mk_MK", "nl_NL",
                "no_NO", "pl_PL", "pt_PT", "pt_BR", "ro_RO", "ru_UA",
                "sk_SK", "sl_SI", "sr_RS", "sv_SE", "tr_TR", "uk_UA",
                "zh_CN", "zh_TW"
              ]'

                PAGE_1=$(curl --fail --silent --show-error \
                'http://127.0.0.1:8000/api/locales?page=1' \
                -H "Authorization: Bearer $TOKEN" \
                -H 'Accept: application/ld+json')

                PAGE_2=$(curl --fail --silent --show-error \
                'http://127.0.0.1:8000/api/locales?page=2' \
                -H "Authorization: Bearer $TOKEN" \
                -H 'Accept: application/ld+json')

                RESPONSE=$(jq -n \
                --argjson page1 "$PAGE_1" \
                --argjson page2 "$PAGE_2" \
                '$page1 | .member = ($page1.member + $page2.member)')

                echo "$RESPONSE" | jq -e \
                --argjson expected "$EXPECTED_LOCALES" '
                (.member | map(.id) | sort) == ($expected | sort)
                and
                (.member | map(select(.default == true) | .id)) == ["en_GB"]
                and
                .totalItems == 38
                '

              echo "API locales and default locale successfully verified."

        - name: Install Playwright
          run: |
              npm install --prefix "$RUNNER_TEMP/playwright" playwright
              "$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install --with-deps chromium

        - name: Test Webinterface Login
          run: |
              node <<'NODE'
              const { chromium } = require(
                `${process.env.RUNNER_TEMP}/playwright/node_modules/playwright`
              );

              (async () => {
                const browser = await chromium.launch({ headless: true });

                try {
                  const page = await browser.newPage();

                  page.on('console', message => {
                    if (message.type() === 'error') {
                      console.error('Browser console:', message.text());
                    }
                  });

                  page.on('pageerror', error => {
                    console.error('Browser error:', error.message);
                  });

                  const loginResponsePromise = page.waitForResponse(response =>
                    response.url().includes('/admin/login') &&
                    response.request().method() === 'POST'
                  );

                  await page.goto('http://127.0.0.1:8000/admin/login', {
                    waitUntil: 'domcontentloaded',
                  });

                  await page.locator('#username').fill('ci-admin');
                  await page.locator('#password').fill(process.env.CI_USER_PASSWORD);

                  await page.getByRole('button', { name: /sign in/i }).click();

                  const loginResponse = await loginResponsePromise;

                  console.log('Login HTTP status:', loginResponse.status());
                  console.log('Login response URL:', loginResponse.url());

                  // Wait for a redirect to the admin dashboard.
                  await page.waitForURL(url =>
                    ['/admin', '/admin/'].includes(url.pathname),
                    { timeout: 10000 }
                  ).catch(() => {});

                  console.log('Final URL:', page.url());

                  const pathname = new URL(page.url()).pathname;

                  if (!['/admin', '/admin/'].includes(pathname)) {
                    throw new Error(
                      `Login failed or dashboard not reached. Final URL: ${page.url()}`
                    );
                  }

                // Verify EasyAdmin dashboard
                await page.locator('.ea-sidebar').waitFor({
                    state: 'visible',
                    timeout: 5000,
                });

                // Verify authenticated user in the main header
                const userName = page.locator(
                    '.navbar-custom-menu .user-menu-wrapper .user-name'
                ).first();

                await userName.waitFor({
                    state: 'visible',
                    timeout: 5000,
                });

                if (!(await userName.textContent())?.trim()) {
                    throw new Error('Authenticated user name is missing.');
                }

                  console.log('Webinterface login successful.');
                } finally {
                  await browser.close();
                }
              })().catch(error => {
                console.error(error);
                process.exit(1);
              });
              NODE
          env:
              CI_USER_PASSWORD: ${{ env.CI_USER_PASSWORD }}
