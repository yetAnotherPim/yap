on:
    workflow_call:
        inputs:
            CURRENT_PHP_VERSION:
                type: string
                required: true
            PREVIOUS_PHP_VERSION:
                type: string
                required: true

name: Test

jobs:
    unit:
        name: Test
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php-version: [ "${{ inputs.PREVIOUS_PHP_VERSION }}","${{ inputs.CURRENT_PHP_VERSION }}" ]
        steps:
            - name: run Tests
              run: exit 1;
