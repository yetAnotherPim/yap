name: DbPlatform Tests

on:
    workflow_call:
        inputs:
            PHP_VERSION:
                type: string
                required: true
            DATABASE_MATRIX:
                type: string
                required: true

jobs:
    db-platform-tests:
        name: Production installation (PostgreSQL)
        runs-on: ubuntu-latest
        env:
            CI_USER_PASSWORD: 'Yap-CI-Only-Password-123!'
        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(inputs.DATABASE_MATRIX) }}

        steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Start databases
          run: |
              docker compose \
                  -f compose-db-test.yaml \
                  up \
                  --detach \
                  --wait \
                  ${{ matrix.service }}

        - name: Setup PHP
          uses: shivammathur/setup-php@v2
          with:
              php-version: ${{ inputs.PHP_VERSION }}
              extensions: ${{ matrix.php_extension }}
              coverage: none

        - name: Install production dependencies
          run: composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader

        - name: Configure application
          run: |
              printf '%s\n' \
                  '${{ matrix.type }}' \
                  '127.0.0.1' \
                  '${{ matrix.port }}' \
                  'app' \
                  'app' \
                  '!ChangeMe!' \
                  | script -q -e -c 'php bin/console yap:setup' /dev/null

        - name: Create database and run migrations
          run: |
              php bin/console doctrine:database:create --if-not-exists
              php bin/console doctrine:schema:create
              php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration

        - name: Verify platform specific indizes
          run: |
              echo todo

        - name: Generate JWT key pair
          run: php bin/console lexik:jwt:generate-keypair --skip-if-exists

        - name: Install Symfony CLI
          run: |
              curl -sS https://get.symfony.com/cli/installer | bash
              echo "$HOME/.symfony5/bin" >> "$GITHUB_PATH"

        - name: Start production web server
          run: |
              symfony server:start \
                --no-tls \
                --port=8000 \
                --listen-ip=127.0.0.1 \
                --daemon

              symfony server:status

        - name: Create API user
          run: |
            printf '%s\n' \
              'ci-api-user' \
              'ci-api@example.test' \
              'CI' \
              'API User' \
              'ROLE_API_USER' \
              "$CI_USER_PASSWORD" \
              "$CI_USER_PASSWORD" \
              | script -q -e -c 'php bin/console yap:user:create' /dev/null

        - name: Test API authentication
          run: |
              RESPONSE=$(curl --fail --silent --show-error \
                -X POST http://127.0.0.1:8000/api/auth \
                -H 'Content-Type: application/json' \
                -d "{\"username\":\"ci-api-user\",\"password\":\"$CI_USER_PASSWORD\"}")

              TOKEN=$(echo "$RESPONSE" | jq -er '.token')

              test -n "$TOKEN"
              echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"
              echo "API authentication successful. JWT received."

        - name: Test API locales
          run: |
              #TODO: only check: has 38 locales, default locale is en_GB via direct request


              EXPECTED_LOCALES='[
                "ar", "bg_BG", "ca_AD", "cs_CZ", "da_DK", "de_DE",
                "el_GR", "en_GB", "es_ES", "eu_ES", "fa_IR", "fi_FI",
                "fr_FR", "gl_ES", "he_IL", "hr_HR", "hu_HU", "hy_AM",
                "id_ID", "it_IT", "lb_LU", "lt_LT", "mk_MK", "nl_NL",
                "no_NO", "pl_PL", "pt_PT", "pt_BR", "ro_RO", "ru_UA",
                "sk_SK", "sl_SI", "sr_RS", "sv_SE", "tr_TR", "uk_UA",
                "zh_CN", "zh_TW"
              ]'

                PAGE_1=$(curl --fail --silent --show-error \
                'http://127.0.0.1:8000/api/locales?page=1' \
                -H "Authorization: Bearer $TOKEN" \
                -H 'Accept: application/ld+json')

                PAGE_2=$(curl --fail --silent --show-error \
                'http://127.0.0.1:8000/api/locales?page=2' \
                -H "Authorization: Bearer $TOKEN" \
                -H 'Accept: application/ld+json')

                RESPONSE=$(jq -n \
                --argjson page1 "$PAGE_1" \
                --argjson page2 "$PAGE_2" \
                '$page1 | .member = ($page1.member + $page2.member)')

                echo "$RESPONSE" | jq -e \
                --argjson expected "$EXPECTED_LOCALES" '
                (.member | map(.id) | sort) == ($expected | sort)
                and
                (.member | map(select(.default == true) | .id)) == ["en_GB"]
                and
                .totalItems == 38
                '

              echo "API locales and default locale successfully verified."

        - name: Test Task execution time has been updated
          run: |
              php bin/console yap:plugin:activate Scheduler
              php bin/console messenger:consume scheduler_default --time-limit=5
              #todo: check if task execution time has been updated
