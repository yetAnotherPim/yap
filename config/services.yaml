parameters:
    plugin_configuration_folder: "/var/plugin_configuration/"

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/plugins/'

    plugins:
        namespace: App\plugins\
        resource: '../src/plugins/*/Plugin.php'
        tags: [ plugin ]

when@test:
    services:
        _defaults:
            autowire: true
            autoconfigure: true
            public: true

when@prod:
    parameters:
        .container.dumper.inline_factories: true
        debug.container.dump: false

